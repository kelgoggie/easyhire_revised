{% comment %}
Shared autocomplete widget. Usage from any page:
  window.createAutocomplete(inputEl, '/api/autocomplete/<endpoint>/');
{% endcomment %}
<script>
window.createAutocomplete = function(inputEl, endpoint) {
  if (!inputEl || inputEl.dataset.autocomplete) return;
  inputEl.dataset.autocomplete = 'true';
  const wrapper = document.createElement('div');
  wrapper.className = 'relative';
  inputEl.parentNode.insertBefore(wrapper, inputEl);
  wrapper.appendChild(inputEl);
  const dropdown = document.createElement('ul');
  dropdown.className = 'absolute left-0 right-0 bg-white border border-gray-200 rounded-xl shadow-lg z-50 mt-1 hidden max-h-48 overflow-y-auto';
  wrapper.appendChild(dropdown);
  let timer;
  inputEl.addEventListener('input', function() {
    clearTimeout(timer);
    const q = this.value.trim();
    if (q.length < 1) { dropdown.classList.add('hidden'); return; }
    timer = setTimeout(function() {
      fetch(endpoint + '?q=' + encodeURIComponent(q))
        .then(function(r){ return r.json(); })
        .then(function(results) {
          dropdown.innerHTML = '';
          if (!results.length) { dropdown.classList.add('hidden'); return; }
          results.forEach(function(item) {
            const li = document.createElement('li');
            li.textContent = item;
            li.className = 'px-4 py-2 text-xs text-primary hover:bg-surface cursor-pointer';
            li.addEventListener('mousedown', function(e) {
              e.preventDefault(); inputEl.value = item; dropdown.classList.add('hidden');
              inputEl.dispatchEvent(new Event('change', {bubbles: true}));
            });
            dropdown.appendChild(li);
          });
          dropdown.classList.remove('hidden');
        });
    }, 250);
  });
  inputEl.addEventListener('blur', function() {
    setTimeout(function() { dropdown.classList.add('hidden'); }, 150);
  });
};
</script>
