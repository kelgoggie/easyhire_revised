{% if emoji == "beam" %}
  {# Perfect: huge grin with eye-smiles #}
  <svg class="{{ size }} {{ color }}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" stroke-width="2"/>
    <path d="M7 13c.7 2.5 2.7 4 5 4s4.3-1.5 5-4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 9.5c.4-.5 1-.8 1.5-.8s1.1.3 1.5.8" stroke-width="2" stroke-linecap="round"/>
    <path d="M13 9.5c.4-.5 1-.8 1.5-.8s1.1.3 1.5.8" stroke-width="2" stroke-linecap="round"/>
  </svg>
{% elif emoji == "smile" %}
  {# Great / Good: classic smile #}
  <svg class="{{ size }} {{ color }}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" stroke-width="2"/>
    <path d="M8 14s1.5 2 4 2 4-2 4-2" stroke-width="2" stroke-linecap="round"/>
    <circle cx="9" cy="10" r="1.2" fill="currentColor" stroke="none"/>
    <circle cx="15" cy="10" r="1.2" fill="currentColor" stroke="none"/>
  </svg>
{% elif emoji == "mild" %}
  {# Decent: small smile #}
  <svg class="{{ size }} {{ color }}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" stroke-width="2"/>
    <path d="M9 14.5c.8.8 2 1.3 3 1.3s2.2-.5 3-1.3" stroke-width="2" stroke-linecap="round"/>
    <circle cx="9" cy="10" r="1.2" fill="currentColor" stroke="none"/>
    <circle cx="15" cy="10" r="1.2" fill="currentColor" stroke="none"/>
  </svg>
{% elif emoji == "meh" %}
  {# Partial: neutral, flat mouth #}
  <svg class="{{ size }} {{ color }}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" stroke-width="2"/>
    <path d="M8 15h8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="9" cy="10" r="1.2" fill="currentColor" stroke="none"/>
    <circle cx="15" cy="10" r="1.2" fill="currentColor" stroke="none"/>
  </svg>
{% elif emoji == "sad" %}
  {# Poor: frown #}
  <svg class="{{ size }} {{ color }}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" stroke-width="2"/>
    <path d="M16 16s-1.5-2-4-2-4 2-4 2" stroke-width="2" stroke-linecap="round"/>
    <circle cx="9" cy="10" r="1.2" fill="currentColor" stroke="none"/>
    <circle cx="15" cy="10" r="1.2" fill="currentColor" stroke="none"/>
  </svg>
{% endif %}
