{# Shared JS for the "Verify your email" banner on both jobseeker + employer #}
{# dashboards. Kept in its own partial so the two bases stay in sync.        #}
<script>
(function() {
  const btn    = document.getElementById('resend-verify-btn');
  const msgEl  = document.getElementById('verify-email-msg');
  if (!btn) return;

  function getCookie(name) {
    const v = '; ' + document.cookie, p = v.split('; ' + name + '=');
    if (p.length === 2) return p.pop().split(';').shift();
  }

  function startCooldown(seconds, sentTo) {
    let remaining = seconds;
    const original = 'Resend';
    btn.disabled = true;
    btn.textContent = 'Resend in ' + remaining + 's';
    if (msgEl && sentTo) {
      msgEl.innerHTML =
        '<strong>Email sent.</strong> ' +
        '<span class="text-muted">Check ' + sentTo + ' for a fresh confirmation link.</span>';
    }
    const tick = setInterval(function() {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(tick);
        btn.disabled = false;
        btn.textContent = original;
      } else {
        btn.textContent = 'Resend in ' + remaining + 's';
      }
    }, 1000);
  }

  function showError(text) {
    btn.disabled = false;
    btn.textContent = 'Resend';
    if (msgEl) {
      msgEl.innerHTML =
        '<strong class="text-red-500">Send failed.</strong> ' +
        '<span class="text-muted">' + text + '</span>';
    }
  }

  btn.addEventListener('click', function() {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = 'Sending…';
    fetch('/accounts/resend-verification/', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'X-CSRFToken': getCookie('csrftoken') || '',
        'X-Requested-With': 'XMLHttpRequest',
      },
    })
    .then(function(r) {
      // If the response isn't JSON (session expired → 302 to /login/, CSRF
      // failure → 403 HTML, or 5xx debug traceback), surface a specific
      // error instead of falling through to the silent catch.
      const ct = r.headers.get('content-type') || '';
      if (!ct.includes('application/json')) {
        if (r.status === 403) {
          throw new Error('Session expired. Refresh the page and try again.');
        }
        if (r.status === 302 || r.status === 401) {
          throw new Error('You need to log in again.');
        }
        throw new Error('Server returned an unexpected response (' + r.status + '). Check server logs.');
      }
      return r.json().then(function(d) { return [r.ok, d]; });
    })
    .then(function(pair) {
      const ok = pair[0], data = pair[1];
      if (ok && data.ok) {
        startCooldown(data.wait || 30, data.sent_to);
      } else if (data && data.wait) {
        // Server rejected due to still being in cooldown — sync UI to it.
        startCooldown(data.wait, null);
      } else {
        // If the server returned a diagnostic class name (SMTPAuthenticationError,
        // etc.), surface it inline so the operator doesn't need to hunt logs.
        let msg = (data && data.error) || 'Please try again shortly.';
        if (data && data.exception_class) {
          msg += ' [' + data.exception_class + (data.exception_message ? ': ' + data.exception_message : '') + ']';
        }
        showError(msg);
      }
    })
    .catch(function(err) {
      showError((err && err.message) || 'Network error — check your connection.');
    });
  });
})();
</script>
