{% load static %}

<!-- Partner Logos Bar -->
<div class="px-4 sm:px-8 md:px-16 py-3 flex items-center gap-4 border-b border-taupe/30 bg-surface overflow-x-auto">
    <div class="flex items-center gap-2 flex-shrink-0">
        <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-taupe/20 border border-taupe/40 flex items-center justify-center overflow-hidden">
            <img src="{% static 'images/peso_logo.png' %}" alt="PESO Iloilo City" class="w-full h-full object-contain" onerror="this.style.display='none'">
        </div>
        <span class="text-xs text-muted font-medium leading-tight">PESO<br>Iloilo City</span>
    </div>
    <div class="w-px h-6 bg-taupe/40 flex-shrink-0"></div>
    <div class="flex items-center gap-2 flex-shrink-0">
        <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-taupe/20 border border-taupe/40 flex items-center justify-center overflow-hidden">
            <img src="{% static 'images/iloilo_logo.png' %}" alt="Iloilo City" class="w-full h-full object-contain" onerror="this.style.display='none'">
        </div>
        <span class="text-xs text-muted font-medium leading-tight">Iloilo City<br>Government</span>
    </div>
</div>
